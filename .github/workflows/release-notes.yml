---
name: Release notes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    if: github.repository == 'coliff/bootstrap-forced-colors-css'

    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
